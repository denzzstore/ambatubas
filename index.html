
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anime Surprise</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #170a29, #64145c);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .anime {
      width: min(90%, 340px);
      border-radius: 20px;
      box-shadow: 0 0 30px #ff42c8;
    }

    h1 { color: #ff9be7; }
    p { padding: 0 15px; }
  </style>
</head>
<body>
  <h1>✨ Anime Surprise ✨</h1>

  <svg class="anime" viewBox="0 0 320 380"
       xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg" x2="1" y2="1">
        <stop stop-color="#ff79d4"/>
        <stop offset="1" stop-color="#5525a6"/>
      </linearGradient>
    </defs>
    <rect width="320" height="380" rx="20" fill="url(#bg)"/>
    <circle cx="160" cy="145" r="100" fill="#ffb9e7" opacity=".3"/>
    <path d="M45 380 Q55 260 115 255 L205 255 Q265 260 275 380"
          fill="#25204b"/>
    <path d="M85 155 Q65 25 160 35 Q260 25 240 160
             L225 245 L95 245Z" fill="#8a37bd"/>
    <ellipse cx="160" cy="160" rx="68" ry="85" fill="#ffddce"/>
    <path d="M91 150 Q70 40 160 35 Q260 30 237 150
             L212 112 L174 125 L123 100Z" fill="#e95bbd"/>
    <ellipse cx="137" cy="160" rx="9" ry="13" fill="#6238a8"/>
    <ellipse cx="184" cy="160" rx="9" ry="13" fill="#6238a8"/>
    <circle cx="139" cy="156" r="3" fill="white"/>
    <circle cx="186" cy="156" r="3" fill="white"/>
    <path d="M145 192 Q160 207 177 192" stroke="#c75c89"
          stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M125 240 L160 280 L195 240 L220 275
             L200 380 L120 380 L100 275Z" fill="#ff5ab9"/>
    <text x="160" y="340" fill="white" font-size="20"
          font-weight="bold" text-anchor="middle">SURPRISE!</text>
  </svg>

  <p>Selamat datang 👀</p>

  <audio id="sound" preload="auto" playsinline>
    <source
      src="https://mp3tourl.com/audio/1791708116822-f1020f65-6ff7-497f-8984-164a89f6749d.mp3"
      type="audio/mpeg">
  </audio>

  <script>
    const sound = document.getElementById("sound");
    sound.volume = 1;

    async function startSound() {
      try {
        await sound.play();
        document.removeEventListener("click", startSound);
        document.removeEventListener("touchstart", startSound);
        document.removeEventListener("keydown", startSound);
      } catch (error) {
        // Autoplay mungkin diblokir oleh browser.
      }
    }

    window.addEventListener("load", startSound);
    document.addEventListener("click", startSound);
    document.addEventListener("touchstart", startSound);
    document.addEventListener("keydown", startSound);
  </script>
</body>
</html>
