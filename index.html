
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RicoTV</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
    }
  </style>
</head>
<body>
  <h2>RicoTV</h2>

  <audio id="audio" preload="auto">
    <source
      src="https://mp3tourl.com/audio/1791708116822-f1020f65-6ff7-497f-8984-164a89f6749d.mp3"
      type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById("audio");
    audio.volume = 1;

    window.addEventListener("load", () => {
      audio.play().catch(() => {
        // Browser mungkin memblokir autoplay bersuara.
      });
    });
  </script>
</body>
</html>
