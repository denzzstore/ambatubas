
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RicoTV Audio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      padding: 25px;
    }

    button {
      background: #e50914;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 18px 28px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      color: #ccc;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>RicoTV</h1>
    <p>Tekan tombol untuk memutar suara.</p>

    <button id="playButton">
      🔊 PUTAR SUARA
    </button>

    <p id="status">Audio siap diputar.</p>

    <audio id="audio" preload="auto">
      <source
        src="https://mp3tourl.com/audio/1791708116822-f1020f65-6ff7-497f-8984-164a89f6749d.mp3"
        type="audio/mpeg">
    </audio>
  </div>

  <script>
    const audio = document.getElementById("audio");
    const button = document.getElementById("playButton");
    const status = document.getElementById("status");

    audio.volume = 1.0;

    button.addEventListener("click", async () => {
      try {
        audio.pause();
        audio.currentTime = 0;
        audio.volume = 1.0;

        await audio.play();

        status.textContent = "Suara sedang diputar.";
      } catch (error) {
        status.textContent =
          "Audio gagal diputar. Periksa koneksi atau coba lagi.";
      }
    });
  </script>
</body>
</html>
